# Install to /etc/dnsmasq.d/wlan0_ap.conf on the Pi (a drop-in, not a
# replacement for /etc/dnsmasq.conf -- don't let this take over DNS/DHCP for
# any other interface on the Pi).

interface=wlan0_ap
bind-interfaces
except-interface=lo

dhcp-range=192.168.50.10,192.168.50.100,255.255.255.0,24h
dhcp-option=option:router,192.168.50.1
dhcp-option=option:dns-server,192.168.50.1

# So a phone can reach the webapp as http://launchcontrol.local/ as well as
# by IP -- requires avahi-daemon too if you want mDNS resolution.
address=/launchcontrol.local/192.168.50.1
