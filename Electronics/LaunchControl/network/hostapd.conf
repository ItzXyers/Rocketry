# Install to /etc/hostapd/hostapd.conf on the Pi.
# Binds to wlan0_ap, the virtual AP interface created by
# scripts/setup_wlan0_ap.sh (see systemd/wlan0-ap-iface.service). Channel is
# fixed at 6 to match the flight computer's WIFI_AP_CHANNEL -- both
# interfaces share the Pi's one physical radio, which (per `iw phy0 info`'s
# interface-combination rules) requires the same channel for AP+STA
# concurrency. See README.md before assuming this combination is supported
# on your specific kernel/driver.

interface=wlan0_ap
driver=nl80211

# CHANGE before field use -- must match config.AP_SSID.
ssid=LAUNCHCONTROL-XXXX

hw_mode=g
channel=6
ieee80211n=1
wmm_enabled=1

auth_algs=1
wpa=2
# CHANGE before field use -- must match config.AP_PASSWORD. hostapd requires
# 8-63 chars for a WPA-PSK passphrase.
wpa_passphrase=changeme-launchcontrol
wpa_key_mgmt=WPA-PSK
rsn_pairwise=CCMP

# Deliberately not capped to 1 connection like the flight computer's AP --
# multiple people (e.g. pad crew + LCO) may reasonably want the status page
# open at once. The fire endpoints are still gated by the arm/fire token +
# server-side continuity/arm-sense checks regardless of who's connected.
