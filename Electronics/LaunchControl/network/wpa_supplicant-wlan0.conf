# Install to /etc/wpa_supplicant/wpa_supplicant-wlan0.conf on the Pi, and
# bring up with: wpa_supplicant -B -i wlan0 -c /etc/wpa_supplicant/wpa_supplicant-wlan0.conf
# (or a systemd unit / netplan-style wrapper of the same command -- not
# included here since the exact init mechanism depends on your Pi OS image).
#
# This is the STATION link to the flight computer's own AP
# (firmware/src/wireless.cpp) -- NOT the phone-facing hotspot, which is
# hostapd.conf's wlan0_ap instead.

# CHANGE: set your ISO 3166-1 alpha-2 regulatory domain, required for the
# radio to pick legal transmit power/channels.
country=XX

ctrl_interface=DIR=/var/run/wpa_supplicant GROUP=netdev
update_config=1

network={
    # Must match this specific board's WIFI_AP_SSID / WIFI_AP_PASSWORD in
    # firmware/src/config.h -- placeholders below.
    ssid="FLIGHTCOMPUTER-XXXX"
    psk="changeme12345"
    # Fixed channel 6, matching WIFI_AP_CHANNEL -- also matches wlan0_ap's
    # channel above, since both share the Pi's one physical radio.
    scan_freq=2437
    freq_list=2437
}
