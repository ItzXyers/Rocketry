<!doctype html>
<!--
  Flight computer phone control -- single file, no internet needed.
  1. Join the board's Wi-Fi (WIFI_AP_SSID / WIFI_AP_PASSWORD in firmware/src/config.h).
     Turn mobile data off if the phone keeps dropping the no-internet network.
  2. Open this file in the phone's browser. If it asks for "local network" access, allow it.
  Needs firmware >= 0.2.4 (CORS + /delete + /format).
-->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Flight Computer</title>
<style>
  :root { --bg:#f4f5f7; --card:#fff; --text:#111; --dim:#666; --line:#ddd;
          --ok:#1a7f37; --bad:#c62828; --warn:#b26a00; --accent:#1f5fbf; }
  @media (prefers-color-scheme: dark) {
    :root { --bg:#111317; --card:#1b1e24; --text:#eee; --dim:#9aa0a8; --line:#2c3038;
            --ok:#3fb950; --bad:#f85149; --warn:#d29922; --accent:#4c8dff; }
  }
  * { box-sizing:border-box; }
  body { margin:0; padding:16px; background:var(--bg); color:var(--text);
         font:16px/1.4 system-ui, sans-serif; max-width:560px; margin-inline:auto; }
  h1 { font-size:20px; margin:0 0 12px; }
  h2 { font-size:16px; margin:0 0 10px; }
  .card { background:var(--card); border:1px solid var(--line); border-radius:12px;
          padding:14px; margin-bottom:14px; }
  .row { display:flex; justify-content:space-between; gap:8px; padding:5px 0;
         border-bottom:1px solid var(--line); }
  .row:last-child { border-bottom:0; }
  .row span:first-child { color:var(--dim); }
  .pill { padding:1px 10px; border-radius:999px; font-weight:600; font-size:14px; color:#fff; background:var(--dim); }
  .ok { background:var(--ok); } .bad { background:var(--bad); } .warn { background:var(--warn); }
  button { font:inherit; padding:10px 14px; border-radius:10px; border:0;
           background:var(--accent); color:#fff; cursor:pointer; }
  button:disabled { opacity:.45; }
  #arm { width:100%; padding:16px; font-size:18px; font-weight:700; background:var(--warn); color:#1a1300; margin-top:10px; }
  .del { background:var(--bad); padding:6px 12px; }
  #fmt { background:var(--bad); width:100%; margin-top:10px; }
  .msg { min-height:1.3em; color:var(--dim); font-size:14px; margin:8px 0 0; }
  .msg.big { color:var(--text); font-weight:600; }
  table { width:100%; border-collapse:collapse; }
  td { padding:7px 2px; border-bottom:1px solid var(--line); }
  td:last-child { text-align:right; }
  a { color:var(--accent); }
  input { font:inherit; padding:8px; width:100%; border-radius:8px; border:1px solid var(--line);
          background:var(--bg); color:var(--text); }
  details summary { cursor:pointer; color:var(--dim); }
  pre { font-size:12px; overflow-x:auto; white-space:pre-wrap; word-break:break-all; }
  .tools { display:flex; gap:8px; align-items:center; }
</style>
</head>
<body>
<h1>Flight Computer</h1>

<div class="card">
  <h2>Status <span id="link" class="pill">--</span></h2>
  <div class="row"><span>Flight state</span><span id="state">--</span></div>
  <div class="row"><span>Boot self-test</span><span id="selftest">--</span></div>
  <div class="row"><span>Wireless armed</span><span id="armed">--</span></div>
  <div class="row"><span>Battery</span><span id="batt">--</span></div>
  <div class="row"><span>Altitude AGL</span><span id="alt">--</span></div>
  <div class="row"><span>Accel |a|</span><span id="acc">--</span></div>
  <div class="row"><span>Sensors</span><span id="sensors">--</span></div>
  <div class="row"><span>Log</span><span id="logstat">--</span></div>
  <div class="row"><span>Last update</span><span id="age">--</span></div>
  <button id="arm">ARM flight computer</button>
  <p id="armmsg" class="msg"></p>
</div>

<div class="card">
  <h2>Flight logs</h2>
  <div class="tools"><button id="refresh">Refresh</button><span id="loghdr" class="msg" style="margin:0"></span></div>
  <table id="logs"></table>
  <button id="fmt">Erase ALL logs</button>
  <p id="logmsg" class="msg"></p>
</div>

<div class="card">
  <details>
    <summary>Settings &amp; board config</summary>
    <p class="msg">Board address</p>
    <input id="addr" value="http://192.168.4.1">
    <p><button id="loadcfg">Load /config</button></p>
    <pre id="cfg"></pre>
  </details>
</div>

<script>
const $ = id => document.getElementById(id);
// Served by the board itself (http://192.168.4.1/) -> talk to that origin;
// opened as a local file -> the saved address, else the AP default.
let base = location.protocol.startsWith("http") ? location.origin : "http://192.168.4.1";
try { if (!location.protocol.startsWith("http")) base = localStorage.getItem("fc_addr") || base; } catch (e) {}
$("addr").value = base;
$("addr").addEventListener("change", () => {
  base = $("addr").value.trim().replace(/\/+$/, "");
  try { localStorage.setItem("fc_addr", base); } catch (e) {}
  poll(); loadLogs();
});

let armedHere = false;   // this page saw a successful (or likely) arm
let lastOk = 0;

async function req(path, opts = {}, timeoutMs = 4000) {
  const ctl = new AbortController();
  const t = setTimeout(() => ctl.abort(), timeoutMs);
  try { return await fetch(base + path, { ...opts, signal: ctl.signal, cache: "no-store" }); }
  finally { clearTimeout(t); }
}

function pill(el, text, cls) { el.textContent = text; el.className = "pill " + (cls || ""); }
function yesNo(v) { return v === undefined ? "--" : (v ? "yes" : "no"); }

async function poll() {
  try {
    const d = await (await req("/status")).json();
    lastOk = Date.now();
    pill($("link"), "ONLINE", "ok");
    const st = d.flight_state ?? "--";
    $("state").textContent = st;
    $("state").style.color = st === "ERROR" ? "var(--bad)" : "";
    $("selftest").textContent = d.boot_self_test_passed === undefined ? "--" : (d.boot_self_test_passed ? "passed" : "FAILED");
    $("selftest").style.color = d.boot_self_test_passed === false ? "var(--bad)" : "";
    $("armed").textContent = yesNo(d.wireless_armed);
    if (d.batt_valid) {
      $("batt").textContent = `${d.batt_voltage_v.toFixed(2)} V · ~${d.batt_percent}%` + (d.batt_low ? " LOW" : "");
      $("batt").style.color = d.batt_low ? "var(--bad)" : "";
    } else {
      $("batt").textContent = d.batt_valid === undefined ? "--" : "no reading";
    }
    $("alt").textContent = d.altitude_agl_m === undefined ? "--" : `${d.altitude_agl_m.toFixed(2)} m`;
    $("acc").textContent = d.accel_mag_g === undefined ? "--" : `${d.accel_mag_g.toFixed(2)} g`;
    $("sensors").textContent = `baro ${d.baro_valid ? "OK" : "BAD"} · accel ${d.accel_valid ? "OK" : "BAD"}`;
    $("sensors").style.color = (d.baro_valid && d.accel_valid) ? "" : "var(--bad)";
    const free = d.log_free_bytes !== undefined ? `${(d.log_free_bytes / 1048576).toFixed(1)} MB free` : "";
    $("logstat").textContent = d.logger_full ? "FULL" : (d.logger_ready ? `FLIGHT${String(d.log_file_number).padStart(3, "0")} · ${free}` : `not logging · ${free}`);
    $("logstat").style.color = (d.logger_ready && !d.logger_full) ? "" : "var(--bad)";
    $("arm").disabled = st !== "IDLE_ARMED" || armedHere;
  } catch (e) {
    if (armedHere) pill($("link"), "RADIO OFF (armed)", "warn");
    else pill($("link"), "OFFLINE", "bad");
    $("arm").disabled = true;
  }
  $("age").textContent = lastOk ? `${Math.round((Date.now() - lastOk) / 1000)} s ago` : "never";
}

async function arm() {
  if (!confirm("Arm now? This re-zeros the altimeter and turns the board's radio OFF. The rocket must be on the rail and still.")) return;
  const msg = $("armmsg");
  $("arm").disabled = true;
  msg.className = "msg big";
  msg.textContent = "Arming… keep the rocket still (~5 s).";
  try {
    const r = await req("/arm", { method: "POST" }, 15000);
    const b = await r.json().catch(() => ({}));
    if (r.ok && b.ok) {
      armedHere = true;
      msg.textContent = "ARMED. Listen for beep-beep-beeeep. Radio turns off now (expected).";
      msg.style.color = "var(--ok)";
    } else {
      msg.style.color = "var(--bad)";
      msg.textContent = b.reason === "self_test_failed"
        ? "NOT armed: self-test failed (3 long buzzes). Check sensors and try again."
        : `NOT armed: ${b.reason || "HTTP " + r.status}` + (b.flight_state ? ` (state ${b.flight_state})` : "");
    }
  } catch (e) {
    // The AP drops ~0.5 s after a successful arm, so a lost reply is ambiguous.
    armedHere = true;
    msg.style.color = "var(--warn)";
    msg.textContent = "Connection dropped. Probably armed and the radio went off as designed. Listen: beep-beep-beeeep = armed.";
  }
}

async function loadLogs() {
  const t = $("logs");
  try {
    const txt = await (await req("/logs", {}, 8000)).text();
    t.innerHTML = "";
    let any = false;
    for (const line of txt.split("\n")) {
      const m = line.match(/(FLIGHT(\d+)\.CSV) (\d+)(.*this boot)?/);
      if (m) {
        any = true;
        const n = +m[2], kb = Math.round(m[3] / 1024), cur = !!m[4];
        const tr = document.createElement("tr");
        tr.innerHTML = `<td><a href="${base}/log?n=${n}" download="${m[1]}">${m[1]}</a></td><td>${kb} KB</td><td></td>`;
        if (cur) tr.lastChild.textContent = "this boot";
        else {
          const b = document.createElement("button");
          b.className = "del"; b.textContent = "Delete";
          b.onclick = () => del(n, m[1]);
          tr.lastChild.appendChild(b);
        }
        t.appendChild(tr);
      }
      const f = line.match(/(\d+) log\(s\), (\d+) \/ (\d+) KB free/);
      if (f) $("loghdr").textContent = `${f[1]} logs · ${(f[2] / 1024).toFixed(1)} / ${(f[3] / 1024).toFixed(1)} MB free`;
    }
    if (!any) t.innerHTML = `<tr><td class="msg">No logs</td></tr>`;
  } catch (e) {
    $("loghdr").textContent = "Could not reach the board";
  }
}

async function post(path, what) {
  const msg = $("logmsg");
  msg.textContent = what + "…";
  try {
    const r = await req(path, { method: "POST" }, 30000);
    const b = await r.json().catch(() => ({}));
    msg.textContent = b.ok
      ? `${what} done.` + (b.power_cycle_needed ? " Power-cycle the board to re-run the self-test." : "")
      : `${what} failed: ${b.reason || "HTTP " + r.status}`;
  } catch (e) {
    msg.textContent = `${what} failed: no reply from the board.`;
  }
  loadLogs(); poll();
}

function del(n, name) { if (confirm(`Delete ${name}? Download it first if you need it.`)) post(`/delete?n=${n}`, `Delete ${name}`); }

$("arm").onclick = arm;
$("refresh").onclick = loadLogs;
$("fmt").onclick = () => { if (confirm("Erase EVERY flight log on the board? This cannot be undone.")) post("/format?confirm=YES", "Erase"); };
$("loadcfg").onclick = async () => {
  try { $("cfg").textContent = JSON.stringify(await (await req("/config")).json(), null, 1); }
  catch (e) { $("cfg").textContent = "Could not reach the board"; }
};

poll(); loadLogs();
setInterval(poll, 2000);
</script>
</body>
</html>
