; Flight computer firmware — Arduino Nano ESP32 (ABX00083)
; See ../avionics_bom.md and ../avionics_wiring.md for hardware context.

[platformio]
default_envs = nano_esp32   ; without this, a bare `pio run` builds every env including
                             ; env:native, which has no setup()/loop() to link under `pio run`

[env:nano_esp32]
platform = espressif32
board = arduino_nano_esp32
framework = arduino
monitor_speed = 115200
build_flags =
    -D ARDUINO_USB_CDC_ON_BOOT=1
lib_deps =
    adafruit/Adafruit BMP3XX Library@^2.1.6
    adafruit/Adafruit ADXL375@^1.1.2
    adafruit/Adafruit ADXL343@^1.6.4
    adafruit/Adafruit Unified Sensor@^1.1.15
    adafruit/Adafruit BusIO@^1.17.4
; Excludes the standalone bench mains below, each of which defines its own
; setup()/loop() and would otherwise collide with main.cpp's at link time.
build_src_filter = +<*> -<bench_buzzer_main.cpp> -<bench_chips_main.cpp>

; Standalone bench bring-up for the buzzer module only, before the rest of
; the harness (sensors/SD/deployment) is wired. See src/bench_buzzer_main.cpp.
[env:buzzer_bench]
platform = espressif32
board = arduino_nano_esp32
framework = arduino
monitor_speed = 115200
build_flags =
    -D ARDUINO_USB_CDC_ON_BOOT=1
build_src_filter = -<*> +<buzzer.cpp> +<bench_buzzer_main.cpp>

; Standalone bench bring-up for every flight-computer chip at once: BMP388 +
; ADXL375 (I2C), microSD (SPI), the buzzer, and the SW2 arm-interlock input.
; Interactive serial command console (type HELP). Reuses the real sensors.cpp /
; logger.cpp / buzzer.cpp so it exercises the flight code paths, not throwaways.
; Deliberately does NOT expose the deployment channel — use env:nano_esp32's
; ARM/FIRE serial commands for that. See src/bench_chips_main.cpp.
;   pio run -e chips_bench -t upload && pio device monitor
[env:chips_bench]
extends = env:nano_esp32   ; inherits board / framework / monitor_speed / build_flags / lib_deps
build_src_filter = -<*> +<bench_chips_main.cpp> +<sensors.cpp> +<logger.cpp> +<buzzer.cpp> +<deployment.cpp>

; Host-native build of the pure-math Kalman filter core only (kalman_filter.cpp
; has zero Arduino/board dependencies by design — see src/kalman_filter.h).
; Every other src/*.cpp includes Arduino.h/Wire.h/Adafruit_* headers that don't
; exist under `platform = native`, so only kalman_filter.cpp is pulled in.
[env:native]
platform = native
test_framework = unity
test_build_src = yes
build_src_filter = -<*> +<kalman_filter.cpp>
